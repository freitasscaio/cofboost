# Testa em todo push/PR. Ao criar uma tag v* (ex.: git tag v1.0.0 && git push --tags),
# gera o CofBoost-Setup.exe e publica no GitHub Releases. O site baixa sempre de
# releases/latest/download/CofBoost-Setup.exe.
#
# Segurança: cada ação de terceiros está presa a um commit exato (o comentário diz a versão),
# para que uma etiqueta trocada no projeto dela não mude o que roda aqui. Testes e build rodam
# só com leitura; a permissão de escrita fica no job que publica, que não executa código do repositório.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Testes
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -STA -File tests\Run-Tests.ps1

      - name: Instalar Inno Setup
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --version 6.7.1 -y --no-progress }

      - name: Gerar instalador
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -SkipTests

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CofBoost-Setup
          path: dist/CofBoost-Setup.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: CofBoost-Setup
          path: dist

      # Overclutch 1.0.2 a 1.0.6 procuram "Overclutch-Setup.exe" ao verificar atualização.
      - name: Copiar instalador com o nome antigo
        run: cp dist/CofBoost-Setup.exe dist/Overclutch-Setup.exe

      - name: Publicar release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/CofBoost-Setup.exe
            dist/Overclutch-Setup.exe
          generate_release_notes: true
